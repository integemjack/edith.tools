[package]
name = "edith-tools"
description = "EDITH 的共享工具：讲 EDITH 能力协议的独立程序（WebSocket 入口、共享设备……），大脑要用时从这个仓库的 Release 下载"
version = "0.1.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/integemjack/edith.tools"

# 每个工具一个程序；index.json 里的工具名就是程序名
[[bin]]
name = "edith-websocket"
path = "tools/websocket/main.rs"

[[bin]]
name = "edith-connect"
path = "tools/connect/main.rs"

# 自己是一个工作区
[workspace]

[dependencies]
ureq = "3"
chrono = { version = "0.4", default-features = false, features = ["std", "clock"] }
serde_json = "1"
uuid = { version = "1", features = ["v4"] }
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
