# edith-websocket：远程能力的中转（tools/websocket）。只在它自己（或共用的测试、工具链、流水线）改了时跑，别的工具改了不动它
name: edith-websocket

on:
  push:
    paths:
      - tools/websocket/**
      - support/**
      - rust-toolchain.toml
      - scripts/**
      - .github/workflows/tool.yml
      - .github/workflows/websocket.yml
  workflow_dispatch:
    inputs:
      release:
        description: 没改也发一版（只在 main 上）
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: edith-websocket-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tool:
    uses: ./.github/workflows/tool.yml
    with:
      dir: websocket
      release: ${{ inputs.release == true }}
