[package]
name = "edith-websocket"
description = "远程能力的中转：设备、网页、手机连它的 WebSocket，每个客户端经大脑的套接字成为一个能力"
# 每个工具各自的版本：发布标签是 edith-websocket-v<前两位>.<这个工具发过几次>（.github/workflows/tool.yml）
version = "0.2.0"
edition = "2024"
publish = false
license = "MIT OR Apache-2.0"
repository = "https://github.com/integemjack/edith.tools"

# 自己一个工作区：各个工具相互隔离（各自的依赖、Cargo.lock、版本、发布），改了一个不动别的
[workspace]

[dependencies]
serde_json = "1"
tungstenite = { version = "0.30", default-features = false, features = ["handshake"] }

[dev-dependencies]
# 测试扮大脑用的（只在测试里）
edith-tools-support = { path = "../../support" }

[profile.release]
codegen-units = 1
lto = "thin"
strip = "debuginfo"
